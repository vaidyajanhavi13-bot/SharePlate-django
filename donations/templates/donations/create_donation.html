{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>List Food | SharePlate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/create_donation.css' %}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm border-0 rounded-4 mx-auto"
             style="max-width: 650px;">
            <div class="card-body p-4 p-md-5">

                <a href="/" class="close-btn" aria-label="Back to Home" title="Back to Home">
                    &times;
                </a>

                <h1 class="h3 text-success fw-bold">List Surplus Food</h1>

                
                <p class="text-secondary">
                    Share food that can be collected before the pickup deadline.
                </p>

                <form method="post" enctype="multipart/form-data"> {% csrf_token %} 

                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label" for="{{ field.id_for_label }}">
                                {{ field.label }}
                            </label>
                            {{ field }}

                            {% for error in field.errors %}
                                <div class="text-danger small">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-success w-100">
                        Publish Donation
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
